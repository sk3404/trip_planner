[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marginal-tigers"
version = "0.1.0"
description = "marginal_tigers package with the marginal CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
marginal = "marginal_tigers.cli:main"

[tool.setuptools.packages.find]
include = ["marginal_tigers*"]
