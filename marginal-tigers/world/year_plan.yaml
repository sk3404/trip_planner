# ============================================================================
# YEAR PLAN  (a PRIOR, not a contract)
# ----------------------------------------------------------------------------
# Tier-1, generated-then-hand-edited. The travel-steering lever: change a slot's
# location/theme to send the tigers somewhere; insert an arc to run a trip or a
# Big Louis storyline. Regeneration is explicit + diffable; targeted regen of a
# slice preserves hand edits.
#
# This is a SHORT seed slice (~10 weeks from late June 2026) to prove the
# mechanism — not a full 52. mode tags drive the 80/20 ratio:
#   character_led (~2/3): pure comedy, target_concept usually null
#   concept_led   (~1/3): a concept IS the episode ("Stefan Explains...")
# Slots with an arc_id belong to an arc block (below) and inherit its setting.
# ============================================================================

year: 2026

arcs:
  - id: japan_2026
    title: "Japan (counterparts & shrines)"
    theme: city travel; Jan eats his way across Tokyo; a brush with Shilin's airline world
    location: Japan (Tokyo)
    start_slot: "2026-W28"
    length_slots: 2
    continuity_notes: "They fly out end of W27. Jan acquires souvenirs (and possibly a new stolen plant). Light, non-threatening contact with the associates' Asian counterparts — nostalgia, not danger."
    concept_sequence: [diminishing_marginal_utility]   # the noodle-bowls beat; rest of arc is character-led

  - id: big_louis_seattle_2026
    title: "Big Louis comes calling"
    theme: the city pole intrudes — associates track them down; Big Louis wants revenge (PG-absurd); the associates secretly just miss them
    location: Seattle (and a brief incursion into Yosemite)
    start_slot: "2026-W32"
    length_slots: 2
    continuity_notes: "The ONE big antagonist beat of this slice. Stays affectionate underneath: Louis & Charlie are torn. Resolve gently — no real menace. End back at the nature pole."
    concept_sequence: [rent_seeking]   # one dark-econ beat (the toll booth); the reunion is character-led

